<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes eyeBlink {
        0%, 95%, 100% { ry: 8; }
        97.5% { ry: 2; }
      }
      @keyframes lipSync {
        0%, 100% { d: path("M 100 150 Q 100 155 100 160"); }
        25% { d: path("M 95 148 Q 100 158 105 148"); }
        50% { d: path("M 90 145 Q 100 165 110 145"); }
        75% { d: path("M 95 148 Q 100 158 105 148"); }
      }
      .leo-face {
        animation: breathe 4s ease-in-out infinite;
      }
    </style>
    <radialGradient id="skinGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#fdbf8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4956f;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="120" r="95" fill="#00f0ff" opacity="0.1"/>
  <circle cx="100" cy="120" r="90" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Head -->
  <g class="leo-face">
    <!-- Face shape -->
    <ellipse cx="100" cy="100" rx="55" ry="65" fill="url(#skinGradient)" stroke="#d4956f" stroke-width="2"/>

    <!-- Jawline definition -->
    <path d="M 50 100 Q 50 150 100 160 Q 150 150 150 100"
          fill="none" stroke="#c47a52" stroke-width="1.5" opacity="0.6"/>

    <!-- Hair - Dark brown, styled back -->
    <path d="M 50 80 Q 50 40 100 35 Q 150 40 150 80"
          fill="#3d2817" stroke="#2d1810" stroke-width="1"/>

    <!-- Hair texture lines -->
    <line x1="65" y1="50" x2="70" y2="35" stroke="#2d1810" stroke-width="0.5" opacity="0.5"/>
    <line x1="85" y1="40" x2="85" y2="25" stroke="#2d1810" stroke-width="0.5" opacity="0.5"/>
    <line x1="115" y1="40" x2="115" y2="25" stroke="#2d1810" stroke-width="0.5" opacity="0.5"/>
    <line x1="135" y1="50" x2="130" y2="35" stroke="#2d1810" stroke-width="0.5" opacity="0.5"/>

    <!-- Ears -->
    <ellipse cx="45" cy="100" rx="12" ry="25" fill="url(#skinGradient)" stroke="#d4956f" stroke-width="1.5"/>
    <ellipse cx="155" cy="100" rx="12" ry="25" fill="url(#skinGradient)" stroke="#d4956f" stroke-width="1.5"/>

    <!-- Eyes -->
    <!-- Left eye -->
    <ellipse cx="75" cy="90" rx="10" ry="14" fill="white" stroke="#666" stroke-width="1"/>
    <circle cx="76" cy="92" r="6" fill="#4a90e2" class="leo-eye-left"/>
    <circle cx="77" cy="90" r="3" fill="black"/>
    <circle cx="78" cy="88" r="1.5" fill="white" opacity="0.8"/>

    <!-- Right eye -->
    <ellipse cx="125" cy="90" rx="10" ry="14" fill="white" stroke="#666" stroke-width="1"/>
    <circle cx="124" cy="92" r="6" fill="#4a90e2" class="leo-eye-right"/>
    <circle cx="123" cy="90" r="3" fill="black"/>
    <circle cx="122" cy="88" r="1.5" fill="white" opacity="0.8"/>

    <!-- Eyebrows - Masculine, defined -->
    <path d="M 65 75 Q 75 70 85 72"
          stroke="#2d1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 115 72 Q 125 70 135 75"
          stroke="#2d1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <line x1="100" y1="90" x2="100" y2="125" stroke="#d4956f" stroke-width="2"/>
    <ellipse cx="93" cy="128" rx="3" ry="4" fill="#c47a52"/>
    <ellipse cx="107" cy="128" rx="3" ry="4" fill="#c47a52"/>

    <!-- Mouth/Lips -->
    <path class="leo-lips"
          d="M 85 145 Q 100 155 115 145"
          stroke="#a85a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 85 145 Q 100 148 115 145"
          stroke="#d9825a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Cheeks - Slight blush -->
    <ellipse cx="55" cy="110" rx="8" ry="5" fill="#e8a89a" opacity="0.4"/>
    <ellipse cx="145" cy="110" rx="8" ry="5" fill="#e8a89a" opacity="0.4"/>

    <!-- Facial hair - Light stubble/beard shadow -->
    <circle cx="60" cy="135" r="1" fill="#4a3a2a" opacity="0.5"/>
    <circle cx="70" cy="140" r="0.8" fill="#4a3a2a" opacity="0.5"/>
    <circle cx="80" cy="142" r="0.9" fill="#4a3a2a" opacity="0.5"/>
    <circle cx="120" cy="142" r="0.9" fill="#4a3a2a" opacity="0.5"/>
    <circle cx="130" cy="140" r="0.8" fill="#4a3a2a" opacity="0.5"/>
    <circle cx="140" cy="135" r="1" fill="#4a3a2a" opacity="0.5"/>
  </g>

  <!-- Voice indicator - Active when speaking -->
  <g class="leo-voice-indicator" opacity="0">
    <circle cx="100" cy="120" r="85" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.6"/>
    <circle cx="100" cy="120" r="75" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Listening indicator -->
  <g class="leo-listening" opacity="0">
    <circle cx="100" cy="120" r="100" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.5" stroke-dasharray="10,5"/>
  </g>

  <!-- Status text -->
  <text x="100" y="215" font-family="'Share Tech Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" opacity="0.7">
    LEO READY
  </text>
</svg>
